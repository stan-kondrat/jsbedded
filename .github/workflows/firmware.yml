# Builds the firmware for every board × engine from source and publishes releases:
#   pull request -> build only (images as workflow artifacts)
#   push to main -> build + refresh the rolling "latest" pre-release
#   tag v*       -> build + release for that tag
# The matrix comes from the folders: firmware/boards/*/board.mk × firmware/engines/*/engine.cmake,
# minus each engine.json "unsupported_boards" (scripts/matrix/ci-matrix.sh).
name: firmware

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: matrix
        run: |
          matrix=$(sh scripts/matrix/ci-matrix.sh)
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.board }}, ${{ matrix.engine }})
    needs: matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      PICOTOOL_FETCH_FROM_GIT_PATH: ${{ github.workspace }}/.picotool
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # tags for git describe -> JSB_VERSION

      - name: Read pinned SDK commits
        id: sdk
        run: |
          echo "pico_sdk=$(git rev-parse HEAD:third_party/pico-sdk)" >> "$GITHUB_OUTPUT"
          echo "esp_idf=$(git rev-parse HEAD:third_party/esp-idf)" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          if [ "${{ matrix.platform }}" = pico ]; then
            sudo apt-get install -y -qq --no-install-recommends cmake ninja-build ccache \
              gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          else
            sudo apt-get install -y -qq --no-install-recommends ccache
          fi

      # --- pico-sdk -------------------------------------------------------

      - name: Cache pico-sdk checkout
        if: matrix.platform == 'pico'
        id: pico-sdk-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            third_party/pico-sdk
            .git/modules/third_party/pico-sdk
          key: pico-sdk-${{ steps.sdk.outputs.pico_sdk }}

      - name: Check out pico-sdk (only tinyusb inside it)
        if: matrix.platform == 'pico' && steps.pico-sdk-cache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 third_party/pico-sdk
          git -C third_party/pico-sdk submodule update --init --depth 1 lib/tinyusb

      - name: Cache picotool
        if: matrix.platform == 'pico'
        uses: actions/cache@v6.1.0
        with:
          path: .picotool
          key: picotool-${{ steps.sdk.outputs.pico_sdk }}

      # --- ESP-IDF --------------------------------------------------------

      - name: Cache ESP-IDF checkout
        if: matrix.platform == 'esp-idf'
        id: esp-idf-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            third_party/esp-idf
            .git/modules/third_party/esp-idf
          key: esp-idf-${{ steps.sdk.outputs.esp_idf }}

      - name: Check out ESP-IDF
        if: matrix.platform == 'esp-idf' && steps.esp-idf-cache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 third_party/esp-idf
          git -C third_party/esp-idf submodule update --init --recursive --depth 1 --jobs 8

      - name: Cache ESP-IDF tools
        if: matrix.platform == 'esp-idf'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.espressif
          key: espressif-${{ runner.os }}-${{ steps.sdk.outputs.esp_idf }}

      - name: Install ESP-IDF tools
        if: matrix.platform == 'esp-idf'
        run: third_party/esp-idf/install.sh esp32s3,esp32c3

      # --- engine ---------------------------------------------------------

      - name: Check out engine submodules
        if: matrix.submodules != ''
        run: git submodule update --init --depth 1 ${{ matrix.submodules }}

      # --- build ----------------------------------------------------------

      - name: Register submodules restored from cache
        run: git submodule init third_party/${{ matrix.platform == 'pico' && 'pico-sdk' || 'esp-idf' }}

      - name: Cache ccache
        uses: actions/cache@v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.board }}-${{ matrix.engine }}-${{ hashFiles('firmware/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.board }}-${{ matrix.engine }}-${{ hashFiles('firmware/**') }}-
            ccache-${{ matrix.board }}-${{ matrix.engine }}-
            ccache-${{ matrix.board }}-

      - name: Build
        run: |
          if [ "${{ matrix.platform }}" = esp-idf ]; then
            . third_party/esp-idf/export.sh > /dev/null
          fi
          make firmware BOARD=${{ matrix.board }} ENGINE=${{ matrix.engine }}
          ccache --show-stats || true

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.board }}-${{ matrix.engine }}
          path: build/${{ matrix.board }}-${{ matrix.engine }}/jsbedded-${{ matrix.board }}-${{ matrix.engine }}.*
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          path: build # one folder per board-engine, as in a local build

      - name: Collect images and checksums
        run: make dist

      - name: Refresh the rolling "latest" pre-release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest build/dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Built from main at $GITHUB_SHA. Replaced on every push to main; not a stable release."

      - name: Release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" build/dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
